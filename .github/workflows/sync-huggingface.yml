name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-huggingface-space
  cancel-in-progress: true

jobs:
  sync:
    name: Push main to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync clean snapshot to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set."
            exit 1
          fi

          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          git clone "https://Kentlo:${HF_TOKEN}@huggingface.co/spaces/Kentlo/cert-study-app" hf-space

          rsync -av --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            --exclude "*.pdf" \
            --exclude "data/" \
            --exclude "instance/" \
            --exclude "chroma_db/" \
            --exclude "airflow_logs/" \
            --exclude "airflow_db/" \
            ./ hf-space/

          cd hf-space
          git add .
          git commit -m "Sync from GitHub ${GITHUB_SHA}" || echo "No changes to sync."
          git push origin main
