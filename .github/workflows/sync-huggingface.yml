name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-huggingface-space
  cancel-in-progress: true

jobs:
  sync:
    name: Push main to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set."
            exit 1
          fi

          git remote add huggingface "https://Kentlo:${HF_TOKEN}@huggingface.co/spaces/Kentlo/cert-study-app"
          git push huggingface HEAD:main --force
