name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-huggingface-space
  cancel-in-progress: true

jobs:
  sync:
    name: Push main to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync clean snapshot to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set."
            exit 1
          fi

          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          retry() {
            local attempt=1
            local max_attempts=5
            local delay=20
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${attempt} attempts: $*"
                return 1
              fi
              echo "Command failed. Retrying in ${delay}s... (${attempt}/${max_attempts})"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          rm -rf /tmp/hf-space
          retry git clone "https://Kentlo:${HF_TOKEN}@huggingface.co/spaces/Kentlo/cert-study-app" /tmp/hf-space

          rsync -av --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            --exclude "*.pdf" \
            --exclude "data/" \
            --exclude "instance/" \
            --exclude "chroma_db/" \
            --exclude "airflow_logs/" \
            --exclude "airflow_db/" \
            ./ /tmp/hf-space/

          cd /tmp/hf-space
          git add .
          git commit -m "Sync from GitHub ${GITHUB_SHA}" || echo "No changes to sync."
          retry git push origin main
