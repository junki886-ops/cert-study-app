name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-huggingface-space
  cancel-in-progress: true

jobs:
  sync:
    name: Upload snapshot to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build clean Space snapshot
        run: |
          rm -rf /tmp/hf-space
          mkdir -p /tmp/hf-space

          rsync -av --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            --exclude "*.pdf" \
            --exclude "data/" \
            --exclude "instance/" \
            --exclude "chroma_db/" \
            --exclude "airflow_logs/" \
            --exclude "airflow_db/" \
            ./ /tmp/hf-space/

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set."
            exit 1
          fi

          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="Kentlo/cert-study-app",
              repo_type="space",
              folder_path="/tmp/hf-space",
              path_in_repo=".",
              commit_message=f"Sync from GitHub {os.environ.get('GITHUB_SHA', '')}",
              delete_patterns=[
                  ".github/*",
                  "data/*",
                  "instance/*",
                  "chroma_db/*",
                  "airflow_logs/*",
                  "airflow_db/*",
                  "*.pdf",
              ],
          )
          PY
